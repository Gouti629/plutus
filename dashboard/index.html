<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prism — FNOL Decision Trace Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Prism — FNOL Decision Trace Viewer</h1>
    <p>Every claim the Navigator agent has processed, with its full reasoning trail and cited policy evidence.</p>
  </header>
  <div class="layout">
    <div class="list-pane">
      <div class="list-summary" id="list-summary">Loading claims&hellip;</div>
      <div id="claim-list"></div>
    </div>
    <div class="detail-pane" id="detail-pane">
      <div class="empty-state">Select a claim to see its full trace.</div>
    </div>
  </div>

  <!-- Generated by agent/run_batch.py. Optional: the dashboard also works if
       served via dashboard/server.py, which fetches traces from /api/claims
       instead and this tag can be omitted. -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
